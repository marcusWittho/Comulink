spring:
  application:
    name: shortener
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        # prometheus: métricas para scrape (taxa de 5xx, latência, pool do banco). Bloquear /actuator/* no proxy externo.
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # /actuator/health/database: UP/DOWN do banco, sem detalhes (show-details: never)
        database:
          include: db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

shortener:
  rate-limit:
    create-url:
      capacity: 10
      refill-period: 1m
